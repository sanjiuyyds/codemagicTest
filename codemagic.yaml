# Codemagic：XsTools 未签名 IPA。
# Start new build → main → iOS unsigned IPA
# 不要在这里配置 p12。

workflows:
  ios-unsigned-ipa:
    name: iOS unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.cocoapods
    scripts:
      - name: Prepare iOS project and branding
        script: |
          set -euo pipefail
          chmod +x tool/prepare_ios.sh || true
          bash tool/prepare_ios.sh

      - name: Build iOS .app without signing
        script: |
          set -euo pipefail
          flutter build ios --release --no-codesign

      - name: Pack Payload IPA
        script: |
          set -euo pipefail
          APP="$(find build/ios -name '*.app' -type d | head -n 1)"
          if [ -z "${APP}" ]; then
            echo "没有找到 .app，构建目录如下："
            find build/ios -maxdepth 4 -print || true
            exit 1
          fi
          echo "Using app: ${APP}"
          rm -rf Payload unsigned.ipa
          mkdir Payload
          cp -R "${APP}" Payload/
          zip -qry unsigned.ipa Payload
          ls -lh unsigned.ipa

    artifacts:
      - unsigned.ipa
      - build/ios/iphoneos/*.app
