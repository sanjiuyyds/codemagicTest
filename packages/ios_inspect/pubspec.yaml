name: ios_inspect
description: Native iOS 26 liquid glass host for system and signing inspection.
publish_to: "none"
version: 1.1.2

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: IosInspectPlugin
